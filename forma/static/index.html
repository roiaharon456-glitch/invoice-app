<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c1c">
<title>פורמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered phone-first column of frosted glass over a slow aurora; floating glass tab bar. Deliberately single dark theme (glass needs depth). */
:root{
  --ink:#0a0c1c; --ink-2:#121530; --ink-3:#1a1e3f;
  --fg:#f4f2ff; --fg-dim:rgba(236,233,255,.68); --fg-faint:rgba(236,233,255,.42);
  --line:rgba(255,255,255,.12); --line-hi:rgba(255,255,255,.22);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.10); --glass-3:rgba(255,255,255,.16);
  --coral:#ff6b81; --amber:#ffbf5e; --violet:#a291ff; --teal:#4be4c7; --sky:#6fd3ff;
  --good:#4be4c7; --warn:#ffbf5e; --bad:#ff6b81;
  --f-display:"Karantina","Rubik",system-ui,sans-serif;
  --f-body:"Rubik","Assistant","Segoe UI",system-ui,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.msg .ch{display:block;font-size:10px;letter-spacing:.06em;color:var(--fg-faint);margin-bottom:2px}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(28px) saturate(135%);transform:scale(1.12)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(130% 90% at 50% 0%,transparent 35%,rgba(6,7,18,.78))}
#app{position:relative;z-index:2;min-height:100%}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(118px + env(safe-area-inset-bottom,0px))}

/* glass */
.glass{position:relative;background:linear-gradient(150deg,var(--glass-2),var(--glass) 60%);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px -28px rgba(0,0,0,.75);overflow:hidden;isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-20%),rgba(255,255,255,.10),transparent 45%);opacity:0;transition:opacity .4s;z-index:-1}
.glass:hover::after{opacity:1}
.card{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.muted{color:var(--fg-dim)}
.faint{color:var(--fg-faint)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--fg-faint);font-weight:500}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:700;line-height:.9;letter-spacing:.01em}
h2.sec{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 16px}
.top h1{font-family:var(--f-display);font-size:clamp(44px,12vw,64px);line-height:.85;font-weight:700;background:linear-gradient(100deg,#fff 30%,#ffd6a1 60%,#ff9aa9);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;transition:transform .2s,box-shadow .3s,background .3s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(110deg,var(--coral),var(--amber));color:#1b0f14;box-shadow:0 10px 30px -10px rgba(255,107,129,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:hover{box-shadow:0 14px 40px -10px rgba(255,140,110,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{background:var(--glass-2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--glass-3)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;transition:all .25s}
.chip:hover{border-color:var(--line-hi)}
.chip.on{background:linear-gradient(110deg,rgba(255,107,129,.28),rgba(255,191,94,.22));border-color:rgba(255,191,94,.6);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--glass-2);border:1px solid var(--line)}
.pill svg{width:13px;height:13px}
.pill.train{color:var(--amber);border-color:rgba(255,191,94,.4);background:rgba(255,191,94,.1)}
.pill.rest{color:var(--sky);border-color:rgba(111,211,255,.35);background:rgba(111,211,255,.08)}
.pill.good{color:var(--good);border-color:rgba(75,228,199,.4);background:rgba(75,228,199,.1)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--fg-dim)}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:var(--r-sm);background:rgba(8,10,26,.45);border:1px solid var(--line);outline:none;transition:border .2s,background .2s}
.inp:focus{border-color:rgba(255,191,94,.65);background:rgba(8,10,26,.6)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* screen enter */
.enter>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* hero ring */
.hero{padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ring{position:relative;width:184px;height:184px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:14}
.ring .val{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px rgba(255,140,110,.55))}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;align-content:center}
.ring .big{font-family:var(--f-display);font-size:62px;line-height:.85;font-weight:700}
.ring .lbl{font-size:12px;color:var(--fg-dim)}
.macros{display:flex;flex-direction:column;gap:12px;min-width:0}
.macro .row{font-size:13px}
.macro b{font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.c-p{background:linear-gradient(90deg,#ff8fa0,var(--coral))}
.c-c{background:linear-gradient(90deg,#ffd896,var(--amber))}
.c-f{background:linear-gradient(90deg,#c5baff,var(--violet))}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-p{background:var(--coral)}.d-c{background:var(--amber)}.d-f{background:var(--violet)}

/* water */
.cups{display:flex;flex-wrap:wrap;gap:6px}
.cup{width:30px;height:38px;position:relative;transition:transform .2s}
.cup:hover{transform:translateY(-2px)}
.cup svg{width:100%;height:100%}
.cup .fill{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 100%;transform:scaleY(0)}
.cup.on .fill{transform:scaleY(1)}

/* week bars */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk .col{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.08);position:relative;flex:1;display:flex;align-items:flex-end;overflow:hidden}
.wk .col i{display:block;width:100%;border-radius:inherit;background:linear-gradient(0deg,var(--coral),var(--amber));transition:height 1s cubic-bezier(.2,.8,.2,1)}
.wk .col.over i{background:linear-gradient(0deg,#ff4d6a,#ff8a9b)}
.wk span{font-size:11px;color:var(--fg-faint)}
.wk.today span{color:var(--fg);font-weight:600}
.wk .goal{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.35)}

.tip{display:flex;gap:12px;align-items:flex-start}
.orb{width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--coral),var(--amber),var(--teal),var(--violet),var(--coral));animation:spin 8s linear infinite;box-shadow:0 0 24px rgba(255,140,110,.45);position:relative}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(20,22,50,.9) 60%)}
@keyframes spin{to{transform:rotate(360deg)}}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:var(--r-md);background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.stat .v{font-family:var(--f-display);font-size:38px;line-height:.9;font-weight:700}
.stat .k{font-size:12px;color:var(--fg-dim)}

/* date strip */
.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.date{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;border:1px solid transparent;transition:all .25s;position:relative}
.date b{font-family:var(--f-display);font-size:26px;line-height:1}
.date span{font-size:11px;color:var(--fg-faint)}
.date.on{background:var(--glass-2);border-color:var(--line-hi)}
.date.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--amber)}

/* meals */
.meal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.meal .kc{font-family:var(--f-display);font-size:28px;line-height:1;text-align:left}
.meal .mm{display:flex;gap:12px;font-size:12px;color:var(--fg-dim);flex-wrap:wrap;align-items:center}
.meal .acts{display:flex;gap:2px;justify-content:flex-end}
.meal .acts button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg-faint)}
.meal .acts button:hover{background:var(--glass-2);color:var(--fg)}
.meal .acts button.on{color:var(--amber)}
.meal .acts svg{width:17px;height:17px}
.items{font-size:13px;display:flex;flex-direction:column;gap:6px}
.items .it{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.shimmer{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.16),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* workout */
.ex{padding:16px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-h h3{font-size:17px}
.hint{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:5px 10px;border-radius:999px;margin-top:8px}
.hint svg{width:13px;height:13px}
.hint.up{background:rgba(75,228,199,.12);color:var(--good);border:1px solid rgba(75,228,199,.35)}
.hint.reps{background:rgba(255,191,94,.1);color:var(--amber);border:1px solid rgba(255,191,94,.3)}
.hint.new{background:rgba(111,211,255,.08);color:var(--sky);border:1px solid rgba(111,211,255,.3)}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set.one{grid-template-columns:28px 1fr 48px}
.set .n{font-family:var(--f-display);font-size:24px;color:var(--fg-faint);text-align:center}
.set .inp{min-height:44px;text-align:center;padding:6px}
.set .chk{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;transition:all .3s}
.set .chk svg{width:20px;height:20px;opacity:.35;transition:all .3s}
.set.done .chk{background:linear-gradient(135deg,var(--teal),#2fbfa3);border-color:transparent;box-shadow:0 6px 20px -6px rgba(75,228,199,.7)}
.set.done .chk svg{opacity:1;color:#06201a;transform:scale(1.1)}
.set.done .inp{border-color:rgba(75,228,199,.35)}
.set-h{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;font-size:11px;color:var(--fg-faint);text-align:center}
.set-h.one{grid-template-columns:28px 1fr 48px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{padding:10px 2px;border-radius:14px;text-align:center;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
.sd b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.sd span{display:block;font-size:10px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd.tr{background:rgba(255,191,94,.08);border-color:rgba(255,191,94,.3)}
.sd.tr span{color:var(--amber)}
.sd.today{outline:2px solid rgba(255,255,255,.5);outline-offset:1px}
.progress{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sky));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.hist:first-child{border-top:0}

/* rest timer */
#restbar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.rest{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:999px;animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.rest .rr{width:44px;height:44px;position:relative}
.rest .rr svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest .rr b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}

/* chart */
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{fill:var(--fg-faint);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:rgba(255,255,255,.07)}
.chart .ma{fill:none;stroke:url(#gl);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .raw{fill:rgba(255,255,255,.55)}
.chart .end{fill:var(--amber);stroke:var(--ink);stroke-width:3}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;color:var(--fg-dim)}
.seg button.on{background:var(--glass-3);color:var(--fg)}
.pr{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr b{font-family:var(--f-display);font-size:26px;line-height:1}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.msg.u{align-self:flex-start;background:linear-gradient(120deg,rgba(255,107,129,.32),rgba(255,191,94,.24));border:1px solid rgba(255,191,94,.35);border-bottom-right-radius:6px}
.msg.a{align-self:flex-end;background:var(--glass-2);border:1px solid var(--line);border-bottom-left-radius:6px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.msg p{margin:0}
.msg ul{margin:4px 0;padding-inline-start:18px}
.msg li{margin:2px 0}
.msg h4{margin:6px 0 2px;font-size:15px}
.msg .sp{height:6px}
.msg strong{color:#ffe2b8}
.typing{display:inline-flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg-dim);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px;border-radius:24px}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;resize:none;border:0;background:transparent;outline:none;padding:10px 8px;line-height:1.45}
.composer .send{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center}
.composer .send svg{width:19px;height:19px}
.flip{transform:scaleX(-1)}
.qchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips .chip{flex:none}

/* tabbar */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));padding:6px;border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar .ind{position:absolute;top:6px;bottom:6px;inset-inline-start:calc(6px + var(--ti) * (100% - 12px) / 5);width:calc((100% - 12px)/5);border-radius:20px;background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1px solid var(--line-hi);transition:inset-inline-start .55s cubic-bezier(.3,1.25,.4,1);z-index:-1}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--fg-faint);transition:color .3s;position:relative}
.tab svg{width:22px;height:22px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.tab.on{color:var(--fg)}
.tab.on svg{transform:translateY(-1px) scale(1.08);color:var(--amber)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(4,5,14,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.enter{animation:fade .3s ease both}
.sheet{width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,rgba(40,44,86,.92),rgba(18,20,44,.96))}
.sheet-bg.enter .sheet{animation:up .5s cubic-bezier(.2,.9,.2,1) both}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line-hi);margin:-8px auto 14px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60%);opacity:.4}}

/* toasts */
#toasts{position:fixed;z-index:70;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 18px;border-radius:16px;font-size:14px;background:rgba(30,33,68,.92);border:1px solid var(--line-hi);box-shadow:0 20px 40px -20px #000;animation:pop .45s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .3s}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:22px 40px}
.brand{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.02em}
.brand span{background:linear-gradient(100deg,var(--coral),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-prog{display:flex;gap:6px}
.ob-prog i{width:26px;height:5px;border-radius:9px;background:rgba(255,255,255,.12);transition:all .5s}
.ob-prog i.on{background:linear-gradient(90deg,var(--coral),var(--amber));width:38px}
.ob h2{font-family:var(--f-display);font-size:clamp(46px,13vw,72px);line-height:.85;font-weight:700}
.opt{display:flex;gap:14px;align-items:center;text-align:start;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.04);transition:all .3s;width:100%}
.opt:hover{border-color:var(--line-hi)}
.opt.on{border-color:rgba(255,191,94,.7);background:linear-gradient(120deg,rgba(255,107,129,.18),rgba(255,191,94,.12))}
.opt .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}
.opt .ic svg{width:22px;height:22px}
.opt b{display:block}
.opt small{color:var(--fg-dim);font-size:13px}
.live{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.live .v{font-family:var(--f-display);font-size:40px;line-height:.9}
.err{color:var(--bad);font-size:13px;min-height:18px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumgrid .stat .v{font-size:46px}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;gap:14px;align-content:center}
.splash .orb{width:72px;height:72px}
.empty{text-align:center;padding:26px 16px;color:var(--fg-dim)}
.empty .orb{margin:0 auto 12px}
.note{font-size:12px;color:var(--fg-faint)}
.banner{font-size:13px;padding:10px 14px;border-radius:14px;background:rgba(111,211,255,.08);border:1px solid rgba(111,211,255,.25);color:var(--sky)}

@media (max-width:460px){
  .hero{grid-template-columns:1fr;justify-items:center}
  .macros{width:100%}
  .ring{width:200px;height:200px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

  scale: sv('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 9.5l1.2-1.5"/>'),
  wand: sv('<path d="M5 19L15 9M14 5l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM18.5 12.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/>'),
};

/* ---------- static data ---------- */
const LIFE = {
  sed:    { f: 1.2,  t: "ישיבה רוב היום",  s: "עבודה משרדית, מעט הליכה", ic: "chair" },
  light:  { f: 1.3,  t: "פעילות קלה",      s: "הליכות, עומד חלק מהיום", ic: "walk" },
  active: { f: 1.45, t: "עבודה פעילה",     s: "הרבה זמן בתנועה", ic: "run" },
  very:   { f: 1.6,  t: "עבודה פיזית",     s: "עבודה פיזית קשה רוב היום", ic: "box" },

const EQUIP = {
  gym:        { t: "חדר כושר",          s: "מוטות, מכונות וכבלים", ic: "dumb" },
  dumbbells:  { t: "בית עם משקולות",    s: "משקולות יד וספסל", ic: "home2" },
  bodyweight: { t: "בלי ציוד",          s: "משקל גוף בלבד", ic: "body" },

const DIET = { kosher: "כשר", vegetarian: "צמחוני", vegan: "טבעוני", gluten: "ללא גלוטן", lactose: "ללא לקטוז", nofish: "ללא דגים" };

let LIB = {}, TPL = {}, SPLITS = {};  // loaded from /plan_lib.json (shared with the server)
function genPlan(n, equip) {
  const lib = LIB[equip] || LIB.gym;
  const keys = SPLITS[String(Math.max(1, Math.min(6, n)))];
  return { source: "auto", sessions: keys.map(k => ({ name: TPL[k].name, focus: TPL[k].focus, exercises: TPL[k].pats.map(p => clone(lib[p])) })) };
}

/* ---------- state ---------- */
const S = {
  mode: "loading", uid: null, base: "data/users/local",
  profile: null, days: {}, logs: {}, weights: { entries: [], measures: [] }, coach: { turns: [] },
  tab: "home", enter: true, navDate: today(), wkIdx: null, drafts: {},
  sheet: null, sheetEnter: false, ob: null, aiMeal: null, manual: false, aiPlan: null,
  ai: false, wa: false, aiOff: false, coachBusy: false, stream: null, rest: null, range: 30, slow: false,

const P = {
  profile: () => "profile/main",
  weights: () => "weights/main",
  coach: () => "coach/main",
  day: d => "day/" + d,
  log: id => "log/" + id,
};

/* ---------- store (server API) ---------- */
const pending = {};
const isPending = path => !!pending[path];
async function api(method, url, body) {
  const r = await fetch(url, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { S.mode = "login"; render(); throw { code: "auth" }; }

}
function save(path, data) {

  p.timer = setTimeout(() => flush(path), 450);
}
async function flush(path) {
  const p = pending[path]; if (!p || p.running) return;

  try { await api("PUT", "/api/doc/" + path, data); }
  catch (e) { if (e.code !== "auth") toast("השמירה נכשלה. בדוק חיבור ונסה שוב."); }

}
async function del(path) {

let lastState = "";

}
async function loadState(first, force) {
  try {
    const st = await api("GET", "/api/state");
    const sig = JSON.stringify(st);
    if (!first && !force && sig === lastState) return;
    lastState = sig;
    applyState(st);
    if (first) { S.mode = "ready"; S.slow = false; if (!S.profile) startOnboarding(); S.enter = true; }
    if (!first && !S.profile && !S.ob) startOnboarding();

}
async function init() {
  try { const lib = await (await fetch("/plan_lib.json")).json(); LIB = lib.lib; TPL = lib.templates; SPLITS = lib.splits; } catch (e) {}

  const refresh = () => { if (!document.hidden && S.mode === "ready" && !S.ob && !S.coachBusy) loadState(false); };
  setInterval(refresh, 45000);
  document.addEventListener("visibilitychange", refresh);
}

/* ---------- domain ---------- */
function movingAvg(entries) {
  const e = [...entries].sort((a, b) => a.d.localeCompare(b.d));
  return e.map((x, i) => {
    let s = 0, n = 0;
    for (let j = i; j >= 0 && daysBetween(e[j].d, x.d) < 7; j--) { s += e[j].kg; n++; }
    return { d: x.d, kg: x.kg, ma: s / n };
  });
}
function curWeight() {
  const e = S.weights.entries || [];
  if (e.length) { const m = movingAvg(e); return m[m.length - 1].ma; }
  return S.profile ? S.profile.weight : 75;
}
function calcTargets(p, w, training) {
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5);
  const fac = (LIFE[p.lifestyle] ? LIFE[p.lifestyle].f : 1.3) + ((p.trainDays || []).length) * 0.035;
  const tdee = bmr * fac, adj = p.kcalAdjust || 0;
  const kcal = r10(training ? tdee + adj : tdee * 0.85 + adj);

function sums(d) {

function updDay(d, fn) {

function saveProfile() { save(P.profile(), S.profile); }
function streak() {

function suggest(ex, before) {
  const past = Object.values(S.logs).filter(l => l.date < before).sort((a, b) => b.date.localeCompare(a.date));
  const ul = ex.unit === "sec" ? "שניות" : "חזרות";
  for (const l of past) {
    const e = (l.exercises || []).find(x => x.name === ex.name); if (!e) continue;
    const done = e.sets.filter(s => s.done && num(s.r) > 0); if (!done.length) continue;
    const w = Math.max(...done.map(s => num(s.w))), minR = Math.min(...done.map(s => num(s.r)));
    if (ex.unit === "kg") {
      if (done.length >= ex.sets && minR >= ex.max && ex.inc > 0) return { w: +(w + ex.inc).toFixed(2), r: ex.min, hint: { type: "up", text: `+${ex.inc} ק״ג · כל הסטים הגיעו ל-${ex.max}` } };
      const r = Math.min(ex.max, minR + 1);
      return { w, r, hint: { type: "reps", text: `${w} ק״ג · נסה ${r} חזרות` } };
    }
    const step = ex.unit === "sec" ? 5 : 1, r = minR + step;
    return { w: "", r, hint: { type: minR >= ex.max ? "up" : "reps", text: `יעד: ${r} ${ul}${minR >= ex.max ? " · גרסה קשה יותר מומלצת" : ""}` } };
  }
  return { w: "", r: "", hint: { type: "new", text: ex.unit === "kg" ? "פעם ראשונה · בחר משקל שמשאיר 2 חזרות ברזרבה" : "פעם ראשונה · עצור 2 חזרות לפני כשל" } };
}
function getLog(d, idx) {
  const id = d + "_s" + idx;
  if (S.logs[id]) return S.logs[id];
  if (S.drafts[id]) return S.drafts[id];
  const ses = S.profile.plan.sessions[idx]; if (!ses) return null;
  const log = { id, date: d, idx, name: ses.name, focus: ses.focus, started: null, finished: null,
    exercises: ses.exercises.map(ex => { const sg = suggest(ex, d); return { name: ex.name, unit: ex.unit, min: ex.min, max: ex.max, rest: ex.rest, inc: ex.inc, hint: sg.hint, sets: Array.from({ length: ex.sets }, () => ({ w: sg.w, r: sg.r, done: false })) }; }) };

}
function commitLog(log) {
  if (!S.logs[log.id]) { log.started = Date.now(); S.logs[log.id] = log; delete S.drafts[log.id]; }
  save(P.log(log.id), log);
}
function currentWorkout() {
  const d = today();
  if (S.wkIdx != null) return S.wkIdx;
  const ls = logsOn(d); if (ls.length) return ls[0].idx;
  return scheduledIdx(d);
}
function volume(l) { return (l.exercises || []).reduce((a, e) => a + e.sets.filter(s => s.done).reduce((b, s) => b + num(s.w) * num(s.r), 0), 0); }
function prs() {
  const best = {};
  for (const l of Object.values(S.logs)) for (const e of l.exercises || []) for (const s of e.sets) {
    if (!s.done || num(s.r) <= 0) continue;
    if (e.unit === "kg" && num(s.w) > 0) {
      const v = num(s.w) * (1 + num(s.r) / 30);
      if (!best[e.name] || v > best[e.name].v) best[e.name] = { v, txt: `${num(s.w)} ק״ג × ${num(s.r)}`, unit: "kg", d: l.date };
    } else if (e.unit !== "kg") {
      const v = num(s.r);
      if (!best[e.name] || v > best[e.name].v) best[e.name] = { v, txt: `${v} ${e.unit === "sec" ? "שנ׳" : "חזרות"}`, unit: e.unit, d: l.date };
    }
  }
  return Object.entries(best).map(([n, b]) => ({ n, ...b })).sort((a, b) => (b.unit === "kg") - (a.unit === "kg") || b.v - a.v).slice(0, 8);
}
function trend() {
  const m = movingAvg(S.weights.entries || []); if (m.length < 2) return null;
  const last = m[m.length - 1];
  let ref = m[0];
  for (const x of m) if (daysBetween(x.d, last.d) >= 14) ref = x;
  const span = daysBetween(ref.d, last.d);
  const change = last.ma - ref.ma, perWeek = span > 0 ? change / span * 7 : 0;
  return { last, ref, span, change, perWeek, pct: perWeek / last.ma * 100, n: m.length };
}
function adaptive() {
  const t = trend(); if (!t || t.span < 14 || t.n < 6) return { ready: false, t };

  if (t.pct < -0.75) return { ready: true, t, delta: 150, title: "המשקל יורד מהר מדי", body: `קצב של ${t.perWeek.toFixed(2)} ק״ג בשבוע. ירידה מהירה מסכנת מסת שריר. כדאי להוסיף 150 קק״ל ביום.` };
  return { ready: true, t, delta: 0, title: "הקצב מצוין ל-Recomp", body: `שינוי של ${t.perWeek > 0 ? "+" : ""}${t.perWeek.toFixed(2)} ק״ג בשבוע. ממשיכים עם אותם יעדים.` };
}
const PROTEIN_FOODS = [
  { t: "200 ג׳ קוטג׳ 5%", g: 22, x: ["vegan","lactose"] },
  { t: "150 ג׳ חזה עוף", g: 46, x: ["vegetarian","vegan"] },

  { t: "קופסת טונה במים", g: 26, x: ["vegetarian","vegan","nofish"] },

  { t: "200 ג׳ טופו", g: 30, x: [] },
  { t: "כוס עדשים מבושלות", g: 18, x: [] },

function tip(d) {
  const t = targets(d), s = sums(d), diet = S.profile.diet || [];
  const h = new Date().getHours(), meals = (dayDoc(d).meals || []).length;
  const pLeft = Math.round(t.p - s.p);
  if (!meals) return h < 11 ? "בוקר טוב. ארוחת בוקר עם 30 גרם חלבון תעזור לך לעמוד ביעד בלי מאמץ בערב." : "עוד לא רשמת ארוחה היום. רשום מה אכלת כדי שאוכל לחשב מה חסר.";
  if (s.kcal > t.kcal + 150) return `עברת את היעד ב-${fmt(s.kcal - t.kcal)} קק״ל. זה בסדר, מה שקובע זה הממוצע השבועי. מחר יום חדש.`;
  if (pLeft > 25) {
    const ok = PROTEIN_FOODS.filter(f => !f.x.some(x => diet.includes(x))).slice(0, 3);
    return `חסרים לך ${pLeft} גרם חלבון. רעיונות: ${ok.map(f => `${f.t} (${f.g} ג׳)`).join(" · ")}.`;
  }
  if ((dayDoc(d).water || 0) < t.cups / 2 && h > 13) return `שתית ${dayDoc(d).water || 0} כוסות מתוך ${t.cups}. מלא בקבוק עכשיו.`;
  if (pLeft <= 0) return "עמדת ביעד החלבון. זה הדבר הכי חשוב ל-Recomp. כל הכבוד.";
  return `נשארו ${fmt(Math.max(0, t.kcal - s.kcal))} קק״ל ו-${pLeft} גרם חלבון. אתה במסלול.`;
}

const prevAnim = {};
function render() {
  const app = $("#app");
  const saved = {};
  $$("input[id],textarea[id],select[id]", app).forEach(el => { saved[el.id] = el.value; });
  const act = document.activeElement, actId = act && act.id && app.contains(act) ? act.id : null;
  let sel = null; try { sel = act && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null; } catch (e) {}
  let html;
  if (S.mode === "login") html = loginScreen();
  else if (S.mode === "loading") html = splash();
  else if (S.ob) html = onboarding();
  else if (!S.profile) html = splash();
  else html = shell();
  app.innerHTML = html;
  for (const id in saved) { const el = document.getElementById(id); if (el && !el.hasAttribute("data-fresh")) el.value = saved[id]; }
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  $$(".enter").forEach(c => [...c.children].forEach((ch, i) => ch.style.setProperty("--i", i)));

function runAnims() {
  $$("[data-ring]").forEach(el => {
    const k = el.dataset.ring, to = +el.dataset.to, from = prevAnim["r" + k] ?? +el.dataset.from;
    el.style.strokeDashoffset = from; prevAnim["r" + k] = to;
    if (RM) { el.style.strokeDashoffset = to; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.strokeDashoffset = to; }));
  });
  $$("[data-bar]").forEach(el => {
    const k = el.dataset.bar, to = el.dataset.to, from = prevAnim["b" + k] ?? "0%";
    const prop = el.dataset.prop || "width";
    el.style[prop] = from; prevAnim["b" + k] = to;
    if (RM) { el.style[prop] = to; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style[prop] = to; }));
  });
  $$("[data-count]").forEach(el => {
    const k = el.dataset.count, to = +el.dataset.to, from = prevAnim["c" + k] ?? 0;
    prevAnim["c" + k] = to; countUp(el, from, to);
  });
}
function countUp(el, from, to, dur = 1000) {
  if (RM || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- progress ---------- */
function weightChart() {
  const all = movingAvg(S.weights.entries || []);
  const from = S.range ? addDays(today(), -S.range) : "0000";
  const m = all.filter(x => x.d >= from);
  if (m.length < 2) return `<div class="empty"><div class="orb"></div>הגרף יופיע אחרי שתי שקילות לפחות. מומלץ להישקל כל בוקר, אחרי שירותים ולפני אוכל.</div>`;
  const W = 600, H = 230, L = 40, R = 14, Tp = 16, B = 28;
  const t0 = parse(m[0].d).getTime(), t1 = parse(m[m.length - 1].d).getTime() || t0 + 1;
  const vals = m.flatMap(x => [x.kg, x.ma]);
  let lo = Math.floor((Math.min(...vals) - 0.4) * 2) / 2, hi = Math.ceil((Math.max(...vals) + 0.4) * 2) / 2;
  if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = Math.floor(mid - 1); hi = Math.ceil(mid + 1); }
  const X = d => L + (parse(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const Y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
  const ticks = Array.from({ length: 4 }, (_, i) => lo + (hi - lo) * i / 3);
  const line = m.map((x, i) => (i ? "L" : "M") + X(x.d).toFixed(1) + " " + Y(x.ma).toFixed(1)).join(" ");
  const area = line + ` L${X(m[m.length - 1].d).toFixed(1)} ${H - B} L${X(m[0].d).toFixed(1)} ${H - B} Z`;
  const last = m[m.length - 1], mid = m[Math.floor(m.length / 2)];
  const anim = S.enter || S.chartDraw; S.chartDraw = false;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל">
    <defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#a291ff"/><stop offset=".5" stop-color="#ff6b81"/><stop offset="1" stop-color="#ffbf5e"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b81" stop-opacity=".28"/><stop offset="1" stop-color="#ff6b81" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`).join("")}
    <path d="${area}" fill="url(#ga)"/>
    ${m.map(x => `<circle class="raw" cx="${X(x.d).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.6"/>`).join("")}
    <path class="ma ${anim ? "draw" : ""}" d="${line}"/>
    <circle class="end" cx="${X(last.d)}" cy="${Y(last.ma)}" r="6"/>
    <text x="${L}" y="${H - 8}">${dm(m[0].d)}</text>${m.length > 4 ? `<text x="${X(mid.d)}" y="${H - 8}" text-anchor="middle">${dm(mid.d)}</text>` : ""}<text x="${W - R}" y="${H - 8}" text-anchor="end">${dm(last.d)}</text>
  </svg>`;
}

  },
  // food
  "nav-date"(el) { S.navDate = el.dataset.v; S.aiMeal = null; render(); },
  "toggle-manual"() { S.manual = !S.manual; render(); },
  async "ai-meal"() {
    const ta = $("#meal-text"), txt = ta ? ta.value.trim() : "";
    if (!txt) { toast("תאר קודם מה אכלת"); ta && ta.focus(); return; }
    S.aiMeal = { status: "loading" }; render();
    try {
      const r = await api("POST", "/api/estimate", { text: txt });
      S.aiMeal = sanitizeMeal(r) || { status: "error", msg: "לא הצלחתי לזהות מאכלים בתיאור. נסה לפרט יותר." };
    } catch (e) { S.aiMeal = { status: "error", msg: errCopy(e) }; }
    render();
  },
  "ai-add"() {
    const a = S.aiMeal; if (!a || a.status !== "ready") return;
    addMeal({ name: a.name, kcal: num($("#ai-k").value), p: num($("#ai-p").value), c: num($("#ai-c").value), f: num($("#ai-f").value), items: a.items });
    const ta = $("#meal-text"); if (ta) ta.value = "";
    S.aiMeal = null; render(); toast("הארוחה נוספה");
  },
  "ai-cancel"() { S.aiMeal = null; render(); },
  "manual-add"() {
    const name = $("#m-name").value.trim(), k = num($("#m-k").value);
    if (!name || !k) { toast("הזן שם וקלוריות"); return; }
    addMeal({ name, kcal: k, p: num($("#m-p").value), c: num($("#m-c").value), f: num($("#m-f").value) });
    ["m-name", "m-k", "m-p", "m-c", "m-f"].forEach(id => { const el = $("#" + id); if (el) el.value = ""; });
    render(); toast("הארוחה נוספה");
  },
  "fav-add"(el) { const f = S.profile.favorites[+el.dataset.v]; if (f) { addMeal({ name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f }); toast("נוסף: " + f.name); } },
  "fav-toggle"(el) {
    const m = (dayDoc(S.navDate).meals || []).find(x => x.id === el.dataset.v); if (!m) return;
    const favs = S.profile.favorites = S.profile.favorites || [];
    const i = favs.findIndex(f => f.name === m.name);
    if (i >= 0) favs.splice(i, 1); else { favs.unshift({ name: m.name, kcal: m.kcal, p: m.p, c: m.c, f: m.f }); favs.length = Math.min(favs.length, 30); }
    saveProfile(); render(); toast(i >= 0 ? "הוסר מהמועדפים" : "נשמר במועדפים");
  },
  "meal-del"(el) { updDay(S.navDate, doc => { doc.meals = doc.meals.filter(x => x.id !== el.dataset.v); }); },
  // workout
  "pick-session"() { S.sheet = { type: "pick" }; S.sheetEnter = true; render(); },
  "choose-session"(el) { S.wkIdx = +el.dataset.v; S.sheet = null; S.tab = "workout"; S.enter = true; render(); },
  "set-done"(el) {
    const idx = currentWorkout(), log = getLog(today(), idx); if (!log) return;
    const [ei, si] = el.dataset.v.split(":").map(Number), e = log.exercises[ei], s = e.sets[si];
    const wi = $(`#w-${log.id}-${ei}-${si}`), ri = $(`#r-${log.id}-${ei}-${si}`);
    if (wi) s.w = wi.value; if (ri) s.r = ri.value;
    if (!s.done && !num(s.r)) { s.r = String(e.max); if (ri) ri.value = s.r; }
    s.done = !s.done; commitLog(log); vib(s.done ? 15 : 5);
    if (s.done && !log.finished) startRest(e.rest);
    render();
  },
  "set-add"(el) { const log = getLog(today(), currentWorkout()), e = log.exercises[+el.dataset.v], l = e.sets[e.sets.length - 1]; e.sets.push({ w: l ? l.w : "", r: l ? l.r : "", done: false }); commitLog(log); render(); },
  "set-rm"(el) { const log = getLog(today(), currentWorkout()), e = log.exercises[+el.dataset.v]; if (e.sets.length > 1) { e.sets.pop(); commitLog(log); render(); } },
  finish(el) {
    const log = getLog(today(), currentWorkout()); if (!log) return;
    log.finished = Date.now(); commitLog(log); S.rest = null;
    const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top);
    toast(`אימון הושלם · ${fmt(volume(log))} ק״ג נפח`); render(); scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
  },
  "rest-add"() { if (S.rest) { S.rest.end += 15000; S.rest.total += 15; tickRest(); } },
  "rest-skip"() { S.rest = null; renderRest(); },
  "ai-plan-open"() { S.sheet = { type: "aiplan" }; S.sheetEnter = true; if (!S.aiPlan || S.aiPlan.status !== "loading") S.aiPlan = { status: "idle" }; render(); },
  "ai-plan-reset"() { S.aiPlan = { status: "idle" }; render(); },
  "ai-plan-stop"() { S.aiPlan = { status: "idle" }; render(); },
  async "ai-plan-go"() {
    const req = ($("#plan-req") || {}).value || "", n = S.profile.trainDays.length;
    S.aiPlan = { status: "loading" }; render();
    let next;
    try {
      const r = await api("POST", "/api/plan", { request: req });
      const plan = sanitizePlan(r, n);
      next = plan ? { status: "ready", plan } : { status: "error", msg: "התוכנית שהתקבלה לא הייתה שלמה. נסה שוב." };
    } catch (e) { next = { status: "error", msg: errCopy(e) }; }
    if (!S.aiPlan || S.aiPlan.status !== "loading") return;  // stopped meanwhile
    S.aiPlan = next;
    if (S.sheet && S.sheet.type === "aiplan") render();
  },
  "ai-plan-apply"() { if (S.aiPlan && S.aiPlan.plan) { S.profile.plan = S.aiPlan.plan; saveProfile(); S.drafts = {}; S.wkIdx = null; S.aiPlan = null; S.sheet = null; S.enter = true; render(); toast("התוכנית החדשה הופעלה"); } },
  // progress
  range(el) { S.range = +el.dataset.v; S.chartDraw = true; render(); },
  "apply-adj"(el) { S.profile.kcalAdjust = (S.profile.kcalAdjust || 0) + +el.dataset.v; saveProfile(); render(); toast("היעד עודכן"); },
  // coach
  quick(el) { coachSend(QUICK[+el.dataset.v]); },
  "rem-toggle"() { const r = remDefaults(); S.profile.reminders = Object.assign(r, { enabled: !r.enabled }); saveProfile(); render(); },
  "rem-save"() {
    const r = remDefaults();
    ["weigh", "workout", "evening", "weekly"].forEach(k => { const el = $("#rm-" + k); if (el) r[k] = el.value; });
    const wd = $("#rm-wd"); if (wd) r.weekly_day = +wd.value;
    S.profile.reminders = r; saveProfile(); render(); toast("התזכורות נשמרו");
  },
  "coach-clear"() { S.coach.turns = []; save(P.coach(), S.coach); render(); },
};
const FORMS = {
  weight() {
    const v = num($("#w-in").value);
    if (!(v >= 30 && v <= 300)) { toast("הזן משקל בקילוגרמים"); return; }
    S.weights.entries = (S.weights.entries || []).filter(x => x.d !== today()).concat({ d: today(), kg: Math.round(v * 10) / 10 }).sort((a, b) => a.d.localeCompare(b.d));
    save(P.weights(), S.weights); $("#w-in").value = ""; render(); toast("השקילה נשמרה");
  },
  measure() {
    const e = { d: today() }; let any = false;
    ["waist", "chest", "arm", "hip"].forEach(k => { const v = num($("#ms-" + k).value); if (v > 0) { e[k] = Math.round(v * 10) / 10; any = true; } $("#ms-" + k).value = ""; });
    if (!any) { toast("הזן לפחות מדידה אחת"); return; }
    const ms = S.weights.measures = S.weights.measures || [];
    const ex = ms.find(x => x.d === e.d); if (ex) Object.assign(ex, e); else ms.push(e);
    save(P.weights(), S.weights); render(); toast("המדידה נשמרה");
  },
  coach() { coachSend($("#coach-in").value); },
};

/* ---------- events ---------- */
const app = $("#app");
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const fn = A[t.dataset.act]; if (fn) { if (t.tagName === "BUTTON") e.preventDefault(); fn(t, e); }
});
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (f) { e.preventDefault(); FORMS[f.dataset.form] && FORMS[f.dataset.form](); } });
app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.ob && S.ob) { S.ob.data[el.dataset.ob] = el.value; const lv = $("#ob-live"); if (lv) lv.innerHTML = obLive(); }
  if (el.dataset.set) {
    const log = getLog(today(), currentWorkout()); if (!log) return;
    const [ei, si, f] = el.dataset.set.split(":"); log.exercises[+ei].sets[+si][f] = el.value; commitLog(log);
  }
  if (el.id === "coach-in") { el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight) + "px"; }
});
app.addEventListener("keydown", e => {
  if (e.target.id === "coach-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); coachSend(e.target.value); }
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});
// glass spotlight + hero tilt
const fine = matchMedia("(pointer:fine)").matches;
document.addEventListener("pointermove", e => {
  const g = e.target.closest && e.target.closest(".glass"); if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty("--mx", (e.clientX - r.left) + "px"); g.style.setProperty("--my", (e.clientY - r.top) + "px");
  if (fine && !RM && g.classList.contains("tilt")) { const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; g.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg)`; }
}, { passive: true });
document.addEventListener("pointerout", e => { const g = e.target.closest && e.target.closest(".tilt"); if (g && !g.contains(e.relatedTarget)) g.style.transform = ""; });

/* ---------- aurora background ---------- */
const bg = $("#bg"), bctx = bg.getContext("2d");
const blobs = [
  { c: [255, 107, 129], x: .18, y: .12, r: .58, sx: .10, sy: .06, sp: .00011, ph: 0 },
  { c: [255, 191, 94], x: .86, y: .28, r: .46, sx: .08, sy: .10, sp: .00009, ph: 2 },
  { c: [162, 145, 255], x: .30, y: .78, r: .64, sx: .12, sy: .07, sp: .00007, ph: 4 },
  { c: [75, 228, 199], x: .92, y: .88, r: .40, sx: .07, sy: .09, sp: .00013, ph: 1 },
  { c: [111, 211, 255], x: .55, y: .45, r: .30, sx: .15, sy: .12, sp: .00010, ph: 3 },
];
let px = 0, py = 0, tpx = 0, tpy = 0;
function bgSize() { const s = .3; bg.width = Math.max(1, innerWidth * s); bg.height = Math.max(1, innerHeight * s); }
function bgDraw(t) {
  const W = bg.width, H = bg.height, M = Math.max(W, H);
  px += (tpx - px) * .04; py += (tpy - py) * .04;
  const sc = (window.scrollY || 0) / Math.max(1, innerHeight);
  bctx.globalCompositeOperation = "source-over"; bctx.fillStyle = "#0a0c1c"; bctx.fillRect(0, 0, W, H);
  bctx.globalCompositeOperation = "lighter";
  blobs.forEach((b, i) => {
    const x = (b.x + Math.sin(t * b.sp + b.ph) * b.sx + px * (.02 + i * .008)) * W;
    const y = (b.y + Math.cos(t * b.sp * 1.3 + b.ph) * b.sy + py * (.02 + i * .008) - sc * (.04 + i * .02)) * H;
    const g = bctx.createRadialGradient(x, y, 0, x, y, b.r * M);
    g.addColorStop(0, `rgba(${b.c},.42)`); g.addColorStop(.5, `rgba(${b.c},.12)`); g.addColorStop(1, `rgba(${b.c},0)`);
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  });
  if (!RM && !document.hidden) requestAnimationFrame(bgDraw);
}
bgSize(); addEventListener("resize", bgSize);
addEventListener("pointermove", e => { tpx = e.clientX / innerWidth - .5; tpy = e.clientY / innerHeight - .5; }, { passive: true });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !RM) requestAnimationFrame(bgDraw); });
requestAnimationFrame(bgDraw);

/* ---------- boot ---------- */
render();
init();
})();
</script>
